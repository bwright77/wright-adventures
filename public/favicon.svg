<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 420 420">
  <!--
    Wright Adventures mountain mark — the browser-tab icon.

    Adapts to the browser's theme. On light it is the full-colour mark: Summit
    Navy mountains, River Blue peak. On dark the navy measured 1.2–1.7:1 against
    the tab bar, where a graphic needs 3:1, so the mountains go white — the same
    treatment the site's own dark-background logo already uses (white mountains,
    River Blue peak), not a new colourway. River Blue reads on both, 3.9–5.5:1
    on dark tabs, and stays put.

    The viewBox is cropped to the artwork (it spans 74–426 x 50–450 of the
    original 500 box) with a 10-unit margin, so the mark is about a fifth
    larger at 16px. The artwork itself is unchanged.
  -->
  <style>
    .peak { fill: #009DD6; }
    .mountains { fill: #004667; }
    @media (prefers-color-scheme: dark) {
      .mountains { fill: #FFFFFF; }
    }
  </style>
  <polygon class="peak" points="250.56 50 166.79 219.38 199.18 280.25 251.12 218.85 301.91 280.25 333.21 218.26 250.56 50"/>
